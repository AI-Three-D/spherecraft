<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal renderer harness</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #111a29; color: #eef2ff; font: 15px system-ui; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  aside { position: absolute; top: 20px; left: 24px; pointer-events: none; max-width: 460px; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  p { line-height: 1.5; margin: 6px 0; }
  #status { color: #b9d8cb; white-space: pre-wrap; }
</style>
<!-- This is the only engine path prefix. The packager reads this map too. -->
<script type="importmap">
{"imports": {"engine/": "../core/"}}
</script>
<canvas aria-label="Procedurally textured rotating cube"></canvas>
<aside>
  <h1>Minimal renderer harness</h1>
  <p>Drag to orbit · Scroll to zoom · Space to pause</p>
  <p id="status">Starting WebGPU…</p>
</aside>
<script type="module" src="./main.js"></script>
</html>
