name: LLM PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  llm-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Skip draft PRs — uncomment to enable reviews on drafts
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Review PR with LLM
        run: node .github/scripts/llm-review.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Primary: Gemini free tier.
          # Get a key at: https://aistudio.google.com/app/apikey (use a project with no billing)
          # Add as: Settings > Secrets > Actions > GEMINI_API_KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # If gemini-2.0-flash has no free-tier quota in your region, try gemini-1.5-flash
          GEMINI_MODEL: gemini-1.5-flash
          # Fallback: GitHub Models (gpt-4o-mini).
          # Requires a PAT with models:read scope — github.com/settings/tokens
          # Add as: Settings > Secrets > Actions > GH_MODELS_TOKEN
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
